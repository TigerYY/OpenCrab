# OpenCrab 标准部署模板（Phase 3 E1）
# 启动顺序：postgres -> redis -> control-plane -> web-console
# 使用：docker compose up -d && docker compose ps
version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: opencarb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencarb
      POSTGRES_PASSWORD: opencarb
      POSTGRES_DB: opencarb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencarb -d opencarb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7
    container_name: opencarb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  control-plane:
    build:
      context: ./apps/control-plane
      dockerfile: Dockerfile
    container_name: opencarb-control-plane
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://opencarb:opencarb@postgres:5432/opencarb
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  web-console:
    build:
      context: ./apps/web-console
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
    container_name: opencarb-web-console
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pg_data:
  redis_data:
