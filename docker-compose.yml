version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: opencarb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencarb
      POSTGRES_PASSWORD: opencarb
      POSTGRES_DB: opencarb
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: opencarb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
